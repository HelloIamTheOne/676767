
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCHIVO CLASIFICADO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:white;font-family:Arial;text-align:center}
h1,h3{color:#39FF14;text-shadow:0 0 10px #39FF14}
header{padding:25px 10px}
p{color:#ddd;letter-spacing:1px}
button{padding:13px 20px;margin:8px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
.green{background:#39FF14;color:black}
.blue{background:#008cff;color:white}
.red{background:#ff2020;color:white}
.page{display:none;padding:15px}
.active{display:block}
.card{background:#101010;border:1px solid #39FF14;border-radius:12px;padding:18px;margin:15px auto;max-width:400px}
.card img{width:100%;height:160px;object-fit:cover}
input{display:block;margin:12px auto;padding:13px;width:90%;max-width:350px;background:#151515;color:white;border:1px solid #39FF14;border-radius:6px}
.adminOnly{display:none}
#documents{min-height:40vh}
#loginPanel{display:none}
small{color:#aaa}
</style>
</head>

<body>

<header>
<h1>ARCHIVO CLASIFICADO</h1>
<p>67 67 67 67 67 67 67 67 67 67</p>
</header>

<section id="home" class="page active">
<button class="green" onclick="show('docs')">Documentos</button>
<button class="blue" onclick="show('class')">Clasificación</button>
</section>

<section id="docs" class="page">

<h1 id="docsTitle">DOCUMENTOS</h1>
<p id="docsDescription">Archivo de documentos clasificados</p>

<button class="blue adminOnly" onclick="editSection('docs')">Editar sección</button>

<div id="addPanel" class="card adminOnly">
<h3>Agregar documento</h3>
<input id="docName" placeholder="Nombre del documento">
<label>Imagen de portada (opcional)</label>
<input type="file" id="cover" accept="image/*">
<label>Archivo PDF</label>
<input type="file" id="file" accept="application/pdf">
<button class="green" onclick="addDoc()">Agregar documento</button>
</div>

<div id="documents">Cargando documentos...</div>

<button class="blue" onclick="show('home')">Regresar</button>

<div style="margin-top:50px;padding:20px">
<button class="green" onclick="toggleLogin()">Administrador</button>
<button class="red adminOnly" onclick="logout()">Cerrar sesión</button>
</div>

<div id="loginPanel" class="card">
<h3>ACCESO ADMINISTRADOR</h3>
<input id="adminEmail" type="email" placeholder="Correo electrónico">
<input id="adminPassword" type="password" placeholder="Contraseña">
<button class="green" id="loginButton" onclick="adminLogin()">INICIAR SESIÓN</button>
<button class="red" onclick="toggleLogin()">Cancelar</button>
<p id="loginMessage"></p>
</div>

</section>

<section id="class" class="page">

<h1 id="classTitle">CLASIFICACIÓN</h1>
<p id="classDescription">Niveles de clasificación</p>

<button class="blue adminOnly" onclick="editSection('class')">Editar sección</button>

<div id="levels">
<div class="card"><h3>Clasificación 0</h3><button class="green">Desbloqueado</button></div>
<div class="card"><h3>Clasificación 1</h3><button class="green">Desbloqueado</button></div>
<div class="card"><h3>Clasificación 2</h3><button class="red">Bloqueado</button></div>
<div class="card"><h3>Clasificación 3</h3><button class="red">Bloqueado</button></div>
<div class="card"><h3>Clasificación 4</h3><button class="red">Bloqueado</button></div>
</div>

<button class="blue" onclick="show('home')">Regresar</button>
<button class="red adminOnly" onclick="logout()">Cerrar sesión</button>

</section>

<script>

// CONFIGURACIÓN
const SUPABASE_URL = "https://wiwqnlhavvmhnwmoyjtw.supabase.co";
const SUPABASE_KEY = "sb_publishable_vQHchnFMXr4K5NuWYZD3HA_bXXpyHxZ";
const ADMIN_UID = "a899ab31-456a-40dc-b03d-af59182afd41";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let isAdmin = false;

// NAVEGACIÓN
function show(id){
 document.querySelectorAll('.page').forEach(p=>{
  p.classList.remove('active');
 });
 document.getElementById(id).classList.add('active');
}

// MOSTRAR LOGIN
function toggleLogin(){
 const panel=document.getElementById('loginPanel');
 panel.style.display=panel.style.display==='block'?'none':'block';
}

// PERMISOS VISUALES
function updateAdmin(){
 document.querySelectorAll('.adminOnly').forEach(el=>{
  el.style.display=isAdmin?
   (el.id==='addPanel'?'block':'inline-block'):'none';
 });
}

// MENSAJES
function loginMessage(message,color='#39FF14'){
 const el=document.getElementById('loginMessage');
 el.textContent=message;
 el.style.color=color;
}

// INICIAR SESIÓN
async function adminLogin(){

 const email=document.getElementById('adminEmail').value.trim();
 const password=document.getElementById('adminPassword').value;

 if(!email || !password){
  loginMessage('Escribe tu correo y contraseña','#ff2020');
  return;
 }

 const btn=document.getElementById('loginButton');
 btn.disabled=true;
 btn.textContent='CONECTANDO...';
 loginMessage('Conectando con Supabase...');

 try{

  const {data,error}=await db.auth.signInWithPassword({
   email:email,
   password:password
  });

  if(error){
   loginMessage('Error: '+error.message,'#ff2020');
   return;
  }

  if(data.user.id!==ADMIN_UID){
   await db.auth.signOut();
   isAdmin=false;
   updateAdmin();
   loginMessage('Esta cuenta no es administradora','#ff2020');
   return;
  }

  isAdmin=true;
  updateAdmin();

  document.getElementById('loginPanel').style.display='none';
  document.getElementById('adminPassword').value='';

  await loadDocs();

  alert('¡Administrador activado!');

 }catch(error){
  loginMessage('Error: '+error.message,'#ff2020');
 }finally{
  btn.disabled=false;
  btn.textContent='INICIAR SESIÓN';
 }
}

// CERRAR SESIÓN
async function logout(){
 const {error}=await db.auth.signOut();

 if(error){
  alert(error.message);
  return;
 }

 isAdmin=false;
 updateAdmin();
 await loadDocs();
 alert('Sesión cerrada');
}

// COMPROBAR SESIÓN
async function checkSession(){
 try{
  const {data,error}=await db.auth.getSession();
  if(error)throw error;

  isAdmin=data.session?.user?.id===ADMIN_UID;
  updateAdmin();

 }catch(error){
  console.error(error);
  isAdmin=false;
  updateAdmin();
 }

 await loadDocs();
}

// EDITAR SECCIONES
function editSection(id){
 if(!isAdmin)return;

 const title=document.getElementById(id+'Title');
 const description=document.getElementById(id+'Description');

 const newTitle=prompt('Nuevo título:',title.textContent);
 if(newTitle!==null && newTitle.trim()){
  title.textContent=newTitle.trim();
 }

 const newDescription=prompt('Nueva descripción:',description.textContent);
 if(newDescription!==null && newDescription.trim()){
  description.textContent=newDescription.trim();
 }
}

// CARGAR DOCUMENTOS
async function loadDocs(){

 const container=document.getElementById('documents');
 container.textContent='Cargando documentos...';

 try{

  const {data,error}=await db.from('documents')
   .select('*')
   .order('created_at',{ascending:false});

  if(error)throw error;

  container.innerHTML='';

  if(!data.length){
   container.textContent='No hay documentos disponibles.';
   return;
  }

  data.forEach(doc=>{

   const card=document.createElement('div');
   card.className='card';

   const img=document.createElement('img');
   img.src=doc.cover_url ||
    'https://placehold.co/400x200/101010/39FF14?text=DOCUMENTO';

   const title=document.createElement('h3');
   title.textContent=doc.name;

   const download=document.createElement('button');
   download.className='green';
   download.textContent='Descargar';
   download.onclick=()=>{
    window.open(doc.file_url,'_blank','noopener');
   };

   card.append(img,title,download);

   if(isAdmin){
    const remove=document.createElement('button');
    remove.className='red';
    remove.textContent='Eliminar';
    remove.onclick=()=>deleteDoc(doc);
    card.append(remove);
   }

   container.append(card);
  });

 }catch(error){
  container.textContent='Error cargando documentos: '+error.message;
 }
}

// AGREGAR DOCUMENTOS
async function addDoc(){

 if(!isAdmin)return;

 const name=document.getElementById('docName').value.trim();
 const file=document.getElementById('file').files[0];
 const cover=document.getElementById('cover').files[0];

 if(!name || !file){
  alert('Completa el nombre y selecciona un PDF');
  return;
 }

 if(file.type!=='application/pdf'){
  alert('Selecciona un PDF válido');
  return;
 }

 if(file.size>20*1024*1024){
  alert('Máximo 20 MB');
  return;
 }

 if(cover && !cover.type.startsWith('image/')){
  alert('Imagen no válida');
  return;
 }

 const id=crypto.randomUUID();
 const filePath=id+'.pdf';
 let coverPath=null;

 try{

  let result=await db.storage.from('documentos').upload(filePath,file);
  if(result.error)throw result.error;

  const fileURL=db.storage.from('documentos').getPublicUrl(filePath).data.publicUrl;

  let coverURL=null;

  if(cover){
   coverPath=id+'-cover';

   result=await db.storage.from('documentos').upload(coverPath,cover);
   if(result.error)throw result.error;

   coverURL=db.storage.from('documentos').getPublicUrl(coverPath).data.publicUrl;
  }

  result=await db.from('documents').insert({
   name,
   file_url:fileURL,
   file_path:filePath,
   cover_url:coverURL,
   cover_path:coverPath
  });

  if(result.error)throw result.error;

  document.getElementById('docName').value='';
  document.getElementById('file').value='';
  document.getElementById('cover').value='';

  alert('Documento agregado correctamente');
  await loadDocs();

 }catch(error){

  const paths=[filePath];
  if(coverPath)paths.push(coverPath);

  await db.storage.from('documentos').remove(paths);

  alert('Error: '+error.message);
 }
}

// ELIMINAR DOCUMENTOS
async function deleteDoc(doc){

 if(!isAdmin)return;
 if(!confirm('¿Eliminar este documento?'))return;

 try{

  const {error}=await db.from('documents')
   .delete()
   .eq('id',doc.id);

  if(error)throw error;

  const paths=[doc.file_path];
  if(doc.cover_path)paths.push(doc.cover_path);

  const result=await db.storage.from('documentos').remove(paths);

  if(result.error){
   alert('Registro eliminado, pero no se pudieron eliminar todos los archivos: '+result.error.message);
  }else{
   alert('Documento eliminado');
  }

  await loadDocs();

 }catch(error){
  alert('Error: '+error.message);
 }
}

// CAMBIOS DE SESIÓN
db.auth.onAuthStateChange((event,session)=>{
 isAdmin=session?.user?.id===ADMIN_UID;
 updateAdmin();

 if(event==='SIGNED_IN' || event==='SIGNED_OUT'){
  setTimeout(loadDocs,0);
 }
});

// INICIO
updateAdmin();
checkSession();

</script>
</body>
</html>
